name: Android build

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maui-android:
    name: MAUI Android Release build
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Install the Android MAUI workload
        run: dotnet workload install maui-android --skip-manifest-update

      - name: Restore locked Android dependencies
        run: dotnet restore src/SwiftAid.Mobile/SwiftAid.Mobile.csproj --locked-mode

      - name: Build Android Release target
        run: dotnet build src/SwiftAid.Mobile/SwiftAid.Mobile.csproj --configuration Release --framework net10.0-android --no-restore
