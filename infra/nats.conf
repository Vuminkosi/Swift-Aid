port: 4222
http: 8222

jetstream {
  store_dir: /data/jetstream
}

authorization {
  users = [
    {
      user: $NATS_GATEWAY_USER
      password: $NATS_GATEWAY_PASSWORD
      permissions: {
        publish: [
          "swiftaid.jobs.>",
          "swiftaid.events.case.>",
          "swiftaid.notifications.inapp",
          "$JS.API.STREAM.INFO.SWIFTAID_JOBS",
          "$JS.API.STREAM.INFO.SWIFTAID_EVENTS",
          "$JS.API.STREAM.INFO.SWIFTAID_NOTIFICATIONS",
          "_INBOX.>"
        ]
        subscribe: ["_INBOX.>"]
      }
    }
    {
      user: $NATS_WORKER_USER
      password: $NATS_WORKER_PASSWORD
      permissions: {
        publish: [
          "swiftaid.results.>",
          "swiftaid.progress.>",
          "$JS.API.CONSUMER.MSG.NEXT.SWIFTAID_JOBS.>",
          "$JS.ACK.SWIFTAID_JOBS.>",
          "_INBOX.>"
        ]
        subscribe: ["swiftaid.jobs.>", "_INBOX.>"]
      }
    }
  ]
}

max_payload: 1048576
