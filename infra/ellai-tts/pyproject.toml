[project]
name = "swiftaid-ellai-tts"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "numpy==2.3.4",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "transformers==5.22.1",
    "uvicorn==0.49.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.0.3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
