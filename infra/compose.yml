name: swiftaid

services:
  gateway:
    build:
      context: ..
      dockerfile: src/SwiftAid.Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      TransportSecurity__AllowPlaintextDevelopment: "true"
      TransportSecurity__AllowedDevelopmentHosts__0: minio
      TransportSecurity__AllowedDevelopmentHosts__1: redis
      TransportSecurity__AllowedDevelopmentHosts__2: nats
      TransportSecurity__AllowedDevelopmentHosts__3: qdrant
      ConnectionStrings__SwiftAid: Host=postgres;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      Qdrant__Endpoint: http://qdrant:6333
      Qdrant__ApiKey: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      Nats__Url: nats://nats:4222
      Nats__Username: ${NATS_GATEWAY_USER:?Set NATS_GATEWAY_USER in .env}
      Nats__Password: ${NATS_GATEWAY_PASSWORD:?Set NATS_GATEWAY_PASSWORD in .env}
      Nats__Enabled: "true"
      Nats__EventStream: SWIFTAID_EVENTS
      Nats__EventSubjectPrefix: swiftaid.events.case
      Nats__NotificationStream: SWIFTAID_NOTIFICATIONS
      Nats__NotificationSubject: swiftaid.notifications.inapp
      Minio__Endpoint: http://minio:9000
      Minio__Bucket: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
      Minio__MaxObjectSizeBytes: ${MINIO_MAX_OBJECT_SIZE_BYTES:-104857600}
      Minio__AccessKey: ${MINIO_APP_ACCESS_KEY:-}
      Minio__SecretKey: ${MINIO_APP_SECRET_KEY:-}
      Minio__UseSsl: "false"
      Minio__Enabled: ${MINIO_ENABLED:-false}
      Redis__ConnectionString: redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env},abortConnect=false
      Redis__InstanceName: ${REDIS_INSTANCE_NAME:-swiftaid:}
      Redis__MaximumTtlSeconds: ${REDIS_MAXIMUM_TTL_SECONDS:-3600}
      Redis__Enabled: "true"
      Fcm__Enabled: ${FCM_ENABLED:-false}
      Fcm__ProjectId: ${FCM_PROJECT_ID:-}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      qdrant:
        condition: service_started
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - application
    restart: unless-stopped

  postgres:
    image: postgis/postgis:17-3.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - application
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:6c0652f8d6925b22f2f6f0e0a5365a6c9dbc8768bd6e70ccc1cdc14847e452a0
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Set QDRANT_API_KEY in .env}
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant-data:/qdrant/storage
    # Intentionally no host port: only application-network services can reach it.
    networks:
      - application
    restart: unless-stopped

  nats:
    image: nats:2.15.1-alpine3.22
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      NATS_GATEWAY_USER: ${NATS_GATEWAY_USER:?Set NATS_GATEWAY_USER in .env}
      NATS_GATEWAY_PASSWORD: ${NATS_GATEWAY_PASSWORD:?Set NATS_GATEWAY_PASSWORD in .env}
      NATS_WORKER_USER: ${NATS_WORKER_USER:?Set NATS_WORKER_USER in .env}
      NATS_WORKER_PASSWORD: ${NATS_WORKER_PASSWORD:?Set NATS_WORKER_PASSWORD in .env}
    ports:
      - "127.0.0.1:${NATS_CLIENT_PORT:-4222}:4222"
    volumes:
      - ./nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - application
    restart: unless-stopped

  minio:
    image: swiftaid/minio:RELEASE.2025-10-15T17-29-55Z-source
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/containers/minio/Dockerfile
      args:
        GOMAXPROCS: "2"
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BROWSER: "off"
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - application
    restart: unless-stopped

  minio-bootstrap:
    image: swiftaid/minio-bootstrap:RELEASE.2025-08-13T08-35-41Z-source
    platform: linux/amd64
    build:
      context: ..
      dockerfile: infra/containers/minio-bootstrap/Dockerfile
      args:
        GOMAXPROCS: "2"
    profiles: ["local-bootstrap"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$$MINIO_APP_ACCESS_KEY" || { echo "MINIO_APP_ACCESS_KEY is required for local bootstrap" >&2; exit 1; }
        test -n "$$MINIO_APP_SECRET_KEY" || { echo "MINIO_APP_SECRET_KEY is required for local bootstrap" >&2; exit 1; }
        mc alias set swiftaid http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc admin info swiftaid >/dev/null
        if mc stat "swiftaid/$$MINIO_BUCKET" >/dev/null 2>&1; then
          echo "Refusing to modify an existing bucket: $$MINIO_BUCKET" >&2
          exit 1
        fi
        if mc admin policy info swiftaid swiftaid-private-objects >/dev/null 2>&1; then
          echo "Refusing to modify an existing policy: swiftaid-private-objects" >&2
          exit 1
        fi
        if mc admin user info swiftaid "$$MINIO_APP_ACCESS_KEY" >/dev/null 2>&1; then
          echo "Refusing to modify an existing app user" >&2
          exit 1
        fi
        cat > /tmp/swiftaid-private-objects.json <<JSON
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Action": ["s3:GetBucketLocation", "s3:ListBucket", "s3:ListBucketMultipartUploads"],
              "Resource": ["arn:aws:s3:::$$MINIO_BUCKET"]
            },
            {
              "Effect": "Allow",
              "Action": ["s3:AbortMultipartUpload", "s3:GetObject", "s3:ListMultipartUploadParts", "s3:PutObject"],
              "Resource": ["arn:aws:s3:::$$MINIO_BUCKET/*"]
            }
          ]
        }
        JSON
        mc mb "swiftaid/$$MINIO_BUCKET"
        mc admin policy create swiftaid swiftaid-private-objects /tmp/swiftaid-private-objects.json
        mc admin user add swiftaid "$$MINIO_APP_ACCESS_KEY" "$$MINIO_APP_SECRET_KEY"
        mc admin policy attach swiftaid swiftaid-private-objects --user "$$MINIO_APP_ACCESS_KEY"
        echo "Created a new private local bucket and bucket-scoped app identity."
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:?Set MINIO_BUCKET in .env}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - application
    restart: "no"

  redis:
    image: redis:8.4.7-alpine3.22
    command: ["sh", "-c", "exec redis-server --appendonly no --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - application
    restart: unless-stopped

networks:
  application:
    driver: bridge

volumes:
  postgres-data:
  qdrant-data:
  nats-data:
  minio-data:
